openapi: 3.0.3

info:
  title: CloudLite API
  description: REST API for the CloudLite file-storage backend.
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Folders
    description: Virtual folder hierarchy endpoints currently implemented by the backend.
  - name: Uploads
    description: Direct mapped batch file upload endpoints.
  - name: Change Logs
    description: User-scoped change log sync endpoint.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

paths:

  # ---------------------------------------------------------------------------
  # Folders
  # ---------------------------------------------------------------------------

  /api/folders:
    get:
      tags: [Folders]
      summary: List folders
      description: >
        Returns the authenticated user's root folders when `parentId` is omitted,
        or the direct child folders of the provided parent folder. The parent folder,
        when specified, must belong to the requesting user.
      operationId: listFolders
      parameters:
        - $ref: '#/components/parameters/ParentFolderId'
      responses:
        '200':
          description: Folder list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Folders]
      summary: Create a folder
      description: >
        Creates a new folder for the authenticated user.
        The folder name must be unique within the given parent (or among root folders
        if `parentId` is omitted). The parent folder, when specified, must exist and
        belong to the requesting user.
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Folder created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/folders/batch:
    post:
      tags: [Folders]
      summary: Create folders as a batch tree
      description: >
        Creates multiple folders for the authenticated user from a nested directory
        tree. The backend links each child folder to its parent and computes each
        full folder path before persisting the batch. Folder names must be unique
        among siblings and cannot contain path separators.
      operationId: createFoldersBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderBatchRequest'
      responses:
        '201':
          description: Folders created successfully in pre-order traversal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # Change Logs
  # ---------------------------------------------------------------------------

  /api/change-logs:
    get:
      tags: [Change Logs]
      summary: Get change logs since a synced ID
      description: >
        Returns all change log entries for the authenticated user with an ID greater
        than `latestSyncedId`, ordered by ID ascending. Clients can pass the latest
        log ID they have already synchronized and receive only newer changes.
      operationId: getChangeLogsSince
      parameters:
        - $ref: '#/components/parameters/LatestSyncedId'
      responses:
        '200':
          description: User-scoped change log entries newer than the provided ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # Uploads
  # ---------------------------------------------------------------------------

  /api/upload/files/batch:
    post:
      tags: [Uploads]
      summary: Upload one or more mapped files
      description: >
        Streams one or more files in a single `multipart/form-data` request.
        The request must include a JSON `mapping` part with one `fileId` to
        folder `path` entry per file. Each multipart file part's
        `Content-Disposition` filename must be:
        `<fileId>-<userFileName>` or `<fileId>_<userFileName>`, where `fileId`
        is the client-generated UUID also present in the mapping, and
        `userFileName` is the real filename to store. Example:
        `1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed-report.pdf`. The UUID prefix and
        one optional `-` or `_` separator are removed before storing the file.
        The backend validates folder paths and filename conflicts in the
        database before writing any file bytes, then streams each file to
        `.uploads/<user-sub>/<folder path>/<userFileName>`.
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, mapping]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: >
                    One or more binary file parts. Each part filename must use
                    `<fileId>-<userFileName>` or `<fileId>_<userFileName>`, for
                    example
                    `1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed-report.pdf`.
                mapping:
                  $ref: '#/components/schemas/BatchUploadFileMappingRequest'
      responses:
        '201':
          description: All files uploaded and committed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:

  # -------------------------------------------------------------------------
  # Security schemes
  # -------------------------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak-issued JWT. Obtain a token from the Keycloak realm
        (`/realms/development/protocol/openid-connect/token`) and supply it
        as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable path parameters
  # -------------------------------------------------------------------------

  parameters:
    FolderId:
      name: folderId
      in: path
      required: true
      description: UUID of the folder.
      schema:
        type: string
        format: uuid
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    ParentFolderId:
      name: parentId
      in: query
      required: false
      description: Parent folder UUID. Omit to list root folders.
      schema:
        type: string
        format: uuid
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    LatestSyncedId:
      name: latestSyncedId
      in: query
      required: false
      description: Latest change log ID already synchronized by the client. Defaults to 0.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
        example: 42

  # -------------------------------------------------------------------------
  # Schemas (DTOs)
  # -------------------------------------------------------------------------

  schemas:

    # -- Request bodies -------------------------------------------------------

    CreateFolderRequest:
      type: object
      required: [name]
      description: Request body for creating a new folder.
      properties:
        name:
          type: string
          minLength: 1
          description: Folder name. Must be unique within the parent (or among root folders).
          example: Documents
        parentId:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent folder. Omit to create a root folder.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

    CreateFolderBatchRequest:
      type: object
      required: [directories]
      description: Request body for creating a batch of folders as a nested tree.
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Existing parent folder ID. Omit to create root folders.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        directories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateFolderTreeNodeRequest'

    CreateFolderTreeNodeRequest:
      type: object
      required: [name]
      description: Folder node in a batch creation tree.
      properties:
        name:
          type: string
          minLength: 1
          description: Folder name. Must be unique among sibling nodes.
          example: Photos
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CreateFolderTreeNodeRequest'

    BatchUploadFileMappingRequest:
      type: object
      required: [files]
      description: JSON multipart part mapping client file IDs to destination folder paths.
      properties:
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UploadFileMappingRequest'

    UploadFileMappingRequest:
      type: object
      required: [fileId, path]
      description: >
        Destination mapping for one multipart file. `fileId` must match the UUID
        prefix at the start of the corresponding multipart filename. The rest of
        that filename, after one optional `-` or `_` separator, is treated as the
        user's real filename.
      properties:
        fileId:
          type: string
          format: uuid
          description: UUID prefix used in the multipart filename.
          example: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
        path:
          type: string
          description: Existing destination folder path.
          example: /Documents/Photos

    # -- Response objects -----------------------------------------------------

    FolderResponse:
      type: object
      required: [id, name, path, ownerId, createdAt, updatedAt]
      description: Metadata for a virtual folder.
      properties:
        id:
          type: string
          format: uuid
          description: Unique folder identifier.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
          description: Folder name.
          example: Documents
        path:
          type: string
          description: Full folder path.
          example: /Documents/Photos
        parentId:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent folder, or null for root folders.
          example: null
        ownerId:
          type: string
          format: uuid
          description: UUID of the folder owner.
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the folder was created.
          example: '2026-04-25T20:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the last update.
          example: '2026-04-25T20:00:00Z'

    PublishedFileResponse:
      type: object
      required: [id, name, folderId, storagePath, sizeBytes, sha256, createdAt]
      description: Metadata for a file stored at its final filesystem path.
      properties:
        id:
          type: string
          format: uuid
          description: Unique file identifier.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: Filename inside the folder.
          example: report.pdf
        folderId:
          type: string
          format: uuid
          description: UUID of the parent folder.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        storagePath:
          type: string
          description: Relative path below the configured storage root.
          example: user-sub/Documents/Photos/report.pdf
        sizeBytes:
          type: integer
          format: int64
          description: File size in bytes.
          example: 204800
        sha256:
          type: string
          description: Hex-encoded SHA-256 digest of the file content.
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        mimeType:
          type: string
          nullable: true
          description: MIME type of the file, or null if unknown.
          example: application/pdf
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the file was created.
          example: '2026-04-25T20:02:00Z'

    ChangeLogResponse:
      type: object
      required: [id, eventType, entityType, timestamp, userId]
      description: User-scoped change log entry for client synchronization.
      properties:
        id:
          type: integer
          format: int64
          description: Monotonic change log identifier.
          example: 43
        eventType:
          $ref: '#/components/schemas/EventType'
        entityType:
          $ref: '#/components/schemas/EntityType'
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the change was logged.
          example: '2026-04-25T20:03:00Z'
        fileId:
          type: string
          format: uuid
          nullable: true
          description: Changed file ID, or null for folder-only events.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Changed folder ID, or null for file-only events.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        userId:
          type: string
          format: uuid
          description: User that performed the change.
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11

    # -- Enums ----------------------------------------------------------------

    EventType:
      type: string
      description: Type of change that was logged.
      enum: [CREATE, RENAME, MOVE, DELETE]
      example: CREATE

    EntityType:
      type: string
      description: Type of entity that changed.
      enum: [FILE, DIRECTORY]
      example: FILE

    # -- Error ----------------------------------------------------------------

    ErrorResponse:
      type: object
      required: [status, error, message]
      description: Standard error body returned by GlobalExceptionHandler for 4xx/5xx responses.
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 404
        error:
          type: string
          description: HTTP reason phrase.
          example: Not Found
        message:
          type: string
          description: Human-readable description of what went wrong.
          example: "Folder not found: 3fa85f64-5717-4562-b3fc-2c963f66afa6"

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------

  responses:
    BadRequest:
      description: The request was malformed or violated a business rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No valid Bearer token was provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user does not own the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A resource with the same name already exists in the target location.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
